name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install hashed runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install package and pinned verification tools
        run: |
          python -m pip install --no-deps -e .
          python -m pip install \
            bandit==1.9.4 \
            mypy==2.3.1 \
            pip-audit==2.10.1 \
            pytest==9.1.1 \
            pytest-asyncio==1.3.0 \
            pytest-cov==7.0.0 \
            ruff==0.16.3

      - name: Verify environment
        run: python -m pip check

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy --strict src/telegram_mcp

      - name: Test with branch coverage
        run: pytest --cov --cov-branch

      - name: Security scan
        run: |
          bandit -c pyproject.toml -q -r src
          pip-audit --require-hashes -r requirements.lock

      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir wheelhouse

      - name: Upload wheel
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: telegram-mcp-bridge-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  container:
    name: Docker runtime without network access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t telegram-bridge-test .
      - name: Test installed package, HTTP authentication, persistence and backup
        run: docker run --rm --network none -i --entrypoint python telegram-bridge-test - < tests/docker_smoke.py
